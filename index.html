<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>冥想空间 - 稳定修复版</title>
    <style>
        :root { --accent: #a5b4fc; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        
        /* 视频背景 */
        #bg-video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2; pointer-events: none; }

        /* 核心内容区 */
        .app-container { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 呼吸圆环 - 4-7-8节奏 */
        .breath-circle { 
            width: 300px; height: 300px; border-radius: 50%; border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
            background: radial-gradient(circle, rgba(165,180,252,0.2) 0%, transparent 70%);
            transition: transform 4s ease-in, opacity 4s ease-in;
        }
        .is-breathing .breath-circle { 
            animation: breathe-478 19s infinite; 
        }
        /* 4-7-8呼吸节奏：4秒吸气，7秒憋气，8秒吐气 */
        @keyframes breathe-478 { 
            0% { transform: scale(0.9); opacity: 0.6; }
            21% { transform: scale(1.15); opacity: 1; }
            58% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .timer { font-size: 4rem; font-weight: bold; font-family: monospace; margin-bottom: 20px; }

        /* 底部控制区 */
        .main-controls { position: absolute; bottom: 15%; z-index: 100; text-align: center; width: 100%; }
        .btn-main { 
            padding: 15px 50px; font-size: 1.2rem; border-radius: 50px; border: 2px solid #fff;
            background: #fff; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .btn-main:hover { transform: scale(1.05); background: var(--accent); border-color: var(--accent); }

        /* 右上角菜单 */
        .settings-box { position: fixed; top: 20px; right: 20px; z-index: 200; }
        .menu-dropdown { 
            display: none; position: absolute; top: 50px; right: 0; background: #222; 
            border: 1px solid #444; border-radius: 10px; width: 150px; overflow: hidden;
        }
        .menu-dropdown.show { display: block; }
        .menu-item { padding: 12px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #333; }
        .menu-item:hover { background: #444; }

        /* 左下角调音台 */
        .mixer { position: fixed; bottom: 20px; left: 20px; z-index: 200; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 10px; width: 200px; }
        .mixer label { font-size: 10px; color: #888; display: block; margin-top: 8px; }
        .mixer .control-group { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .mixer .control-group:last-child { border-bottom: none; margin-bottom: 0; }
        .mixer .control-name { font-size: 11px; color: var(--accent); margin-bottom: 5px; }
        input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        .speed-value { font-size: 10px; color: #aaa; text-align: right; display: block; margin-top: 2px; }
    </style>
</head>
<body>

    <video id="bg-video" autoplay muted loop playsinline>
        <source src="cloud.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="settings-box">
        <button class="btn-main" style="padding: 8px 15px; font-size: 14px;" onclick="toggleMenu(event)">场景/时间 ⚙️</button>
        <div class="menu-dropdown" id="menu">
            <div class="menu-item" onclick="changeScene('cloud.mp4', 'cloud_theme.mp3', 'cloud_bg.mp3')">☁️ 云端</div>
            <div class="menu-item" onclick="changeScene('galaxy.mp4', 'galaxy_theme.mp3', 'galaxy_bg.mp3')">🌌 太空</div>
            <div class="menu-item" onclick="changeScene('forest.mp4', 'forest_theme.mp3', 'forest_bg.mp3')">🌲 森林</div>
            <hr style="border: 0.5px solid #333;">
            <div class="menu-item" onclick="setTime(5)">⏱️ 5 分钟</div>
            <div class="menu-item" onclick="setTime(10)">⏱️ 10 分钟</div>
            <div class="item menu-item" onclick="setTime(20)">⏱️ 20 分钟</div>
        </div>
    </div>

    <div class="app-container" id="app">
        <div class="breath-circle">
            <span id="status-text">静心</span>
        </div>
        <div class="timer" id="timer-display">10:00</div>
    </div>

    <div class="main-controls">
        <button class="btn-main" id="start-btn" onclick="startMeditation()">开始练习</button>
        <button class="btn-main" id="pause-btn" onclick="togglePause()" style="display:none; background:transparent; color:#fff;">暂停</button>
    </div>

    <div class="mixer">
        <!-- 旋律音乐控制 -->
        <div class="control-group">
            <div class="control-name">🎵 旋律音乐</div>
            <label>音量</label>
            <input type="range" id="v1" min="0" max="1" step="0.01" value="0.5" oninput="updateVol()">
            <label>倍速</label>
            <input type="range" id="s1" min="0.5" max="2" step="0.1" value="1" oninput="updateSpeed()">
            <span class="speed-value" id="sv1">1.0x</span>
        </div>
        
        <!-- 环境背景控制 -->
        <div class="control-group">
            <div class="control-name">🌿 环境背景</div>
            <label>音量</label>
            <input type="range" id="v2" min="0" max="1" step="0.01" value="0.5" oninput="updateVol()">
            <label>倍速</label>
            <input type="range" id="s2" min="0.5" max="2" step="0.1" value="1" oninput="updateSpeed()">
            <span class="speed-value" id="sv2">1.0x</span>
        </div>
        
        <!-- 深度底噪控制 -->
        <div class="control-group">
            <div class="control-name">🌊 深度底噪</div>
            <label>音量</label>
            <input type="range" id="v3" min="0" max="1" step="0.01" value="0.2" oninput="updateVol()">
            <label>倍速</label>
            <input type="range" id="s3" min="0.5" max="2" step="0.1" value="1" oninput="updateSpeed()">
            <span class="speed-value" id="sv3">1.0x</span>
        </div>
    </div>

    <audio id="a1" loop src="cloud_theme.mp3"></audio>
    <audio id="a2" loop src="cloud_bg.mp3"></audio>
    <audio id="a3" loop src="universal_noise.mp3"></audio>
    <audio id="ag" src="finish_gong.mp3"></audio>

    <script>
        const v = document.getElementById('bg-video');
        const a1 = document.getElementById('a1');
        const a2 = document.getElementById('a2');
        const a3 = document.getElementById('a3');
        const ag = document.getElementById('ag');
        const timerText = document.getElementById('timer-display');
        
        let timeLeft = 600;
        let running = false;
        let paused = false;
        let timer = null;

        function setTime(m) {
            timeLeft = m * 60;
            timerText.innerText = m + ":00";
            document.getElementById('menu').classList.remove('show');
        }

        function updateVol() {
            a1.volume = document.getElementById('v1').value;
            a2.volume = document.getElementById('v2').value;
            a3.volume = document.getElementById('v3').value;
        }

        function updateSpeed() {
            const s1 = document.getElementById('s1').value;
            const s2 = document.getElementById('s2').value;
            const s3 = document.getElementById('s3').value;
            
            a1.playbackRate = parseFloat(s1);
            a2.playbackRate = parseFloat(s2);
            a3.playbackRate = parseFloat(s3);
            
            document.getElementById('sv1').innerText = parseFloat(s1).toFixed(1) + 'x';
            document.getElementById('sv2').innerText = parseFloat(s2).toFixed(1) + 'x';
            document.getElementById('sv3').innerText = parseFloat(s3).toFixed(1) + 'x';
        }

        function changeScene(vs, as1, as2) {
            v.src = vs;
            a1.src = as1;
            a2.src = as2;
            v.load(); a1.load(); a2.load();
            
            // 保持倍速设置
            a1.playbackRate = parseFloat(document.getElementById('s1').value);
            a2.playbackRate = parseFloat(document.getElementById('s2').value);
            
            if(running && !paused) { v.play(); a1.play(); a2.play(); }
            document.getElementById('menu').classList.remove('show');
        }

        function startMeditation() {
            running = true;
            paused = false;
            document.getElementById('app').classList.add('is-breathing');
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'inline-block';
            
            updateVol();
            updateSpeed();
            a1.play(); a2.play(); a3.play(); v.play();

            timer = setInterval(() => {
                if(timeLeft > 0) {
                    timeLeft--;
                    let mm = Math.floor(timeLeft / 60);
                    let ss = timeLeft % 60;
                    timerText.innerText = mm + ":" + (ss < 10 ? '0' : '') + ss;
                } else {
                    clearInterval(timer);
                    ag.play();
                    alert("练习结束");
                }
            }, 1000);
        }

        function togglePause() {
            if(!paused) {
                paused = true;
                clearInterval(timer);
                a1.pause(); a2.pause(); a3.pause(); v.pause();
                document.getElementById('pause-btn').innerText = "继续";
                document.getElementById('app').classList.remove('is-breathing');
            } else {
                paused = false;
                document.getElementById('pause-btn').innerText = "暂停";
                startMeditation();
            }
        }

        function toggleMenu(e) { e.stopPropagation(); document.getElementById('menu').classList.toggle('show'); }
        window.onclick = () => document.getElementById('menu').classList.remove('show');
        window.onload = function() {
            updateVol();
            updateSpeed();
        };
    </script>
</body>
</html>
